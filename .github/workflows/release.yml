name: Release Aura Installer

# 推送 v* 标签时自动构建并发布 Release:
#   git tag v0.0.5-beta && git push origin v0.0.5-beta
# 资产命名沿用产品线惯例:
#   AuraInstaller-py3-10-x64-<tag>.exe  (常规 64 位版)
#   AuraInstaller-py3-8-x64-<tag>.exe   (Windows 7 兼容版)
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-main:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install

      - name: Build project
        run: |
          $venvPath = poetry env info --path
          & "$venvPath\Scripts\Activate.ps1"
          & ".\scripts\build.bat"
        shell: powershell

      - name: Rename artifact
        shell: powershell
        run: Rename-Item -LiteralPath dist/AuraInstaller.exe -NewName "AuraInstaller-py3-10-x64-${{ github.ref_name }}.exe"

      - name: Upload main artifact
        uses: actions/upload-artifact@v6
        with:
          name: installer-main
          path: dist/AuraInstaller-py3-10-x64-*.exe

  # Python 3.8 是最后一个支持 Windows 7 的版本, 使用独立的依赖清单
  # 与 PyInstaller 5.13.2 (PyInstaller 6 不支持 Windows 7)
  build-py3-8:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.8
        uses: actions/setup-python@v6
        with:
          python-version: "3.8"

      - name: Install dependencies
        run: python -m pip install -r requirements-py3.8.txt

      - name: Build project
        run: .\scripts\build.bat
        shell: cmd

      - name: Rename artifact
        shell: powershell
        run: Rename-Item -LiteralPath dist/AuraInstaller.exe -NewName "AuraInstaller-py3-8-x64-${{ github.ref_name }}.exe"

      - name: Upload py3-8 artifact
        uses: actions/upload-artifact@v6
        with:
          name: installer-py3-8
          path: dist/AuraInstaller-py3-8-x64-*.exe

  release:
    runs-on: ubuntu-latest
    needs: [build-main, build-py3-8]
    steps:
      - uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: installer-*
          merge-multiple: true
          path: assets

      - name: Extract changelog section
        shell: python
        run: |
          import re, sys, pathlib
          tag = "${{ github.ref_name }}"
          text = pathlib.Path("CHANGELOG.md") if pathlib.Path("CHANGELOG.md").exists() else None
          body = ""
          if text is not None:
              m = re.search(rf"^## \[Rel\] {re.escape(tag)}\b.*?(?=^## |\Z)", text.read_text(encoding="utf-8"), re.M | re.S)
              if m:
                  body = m.group(0).strip()
          pathlib.Path("release-notes.md").write_text(body or f"Release {tag}", encoding="utf-8")
          print(f"notes length: {len(body)}")

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "[Rel] ${{ github.ref_name }}" \
            --notes-file release-notes.md \
            --verify-tag \
            assets/*
